<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 40px 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            width: 380px; 
            text-align: center; 
        }
        h2 { 
            color: #1e293b; 
            font-size: 2rem;
            margin: 0 0 8px 0; 
        }
        p.subtitle { 
            color: #64748b; 
            font-size: 0.95rem; 
            margin: 0 0 30px 0; 
        }
        .auth-modes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        .mode-btn {
            font-size: 1rem;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            color: #1e293b;
            border-bottom: 2px solid #1e293b;
        }
        .form-group { 
            margin-bottom: 20px; 
            position: relative;
            text-align: left; 
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            color: #334155;
            background-color: #fff;
            transition: all 0.2s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #cbd5e1; 
        }
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            user-select: none;
            font-size: 1.2rem;
        }
        .options-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 12px;
            color: #64748b;
            font-size: 0.9rem;
        }
        .options-row input {
            margin-right: 8px;
            cursor: pointer;
        }
        button.submit-btn { 
            width: 100%; 
            padding: 16px; 
            background: #1e293b; 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-size: 1rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 25px; 
            transition: background 0.2s ease;
        }
        button.submit-btn:hover { 
            background: #334155; 
        }
        #error-message-box { 
            color: #ef4444; 
            font-size: 0.85rem; 
            margin-top: 10px; 
            font-weight: 600; 
            text-align: left; 
            min-height: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 id="mainTitle">System Login</h2>
    <p class="subtitle" id="mainSubtitle">Verify credentials to proceed</p>
    
    <div class="auth-modes">
        <span class="mode-btn active" id="loginMode" onclick="setMode('login')">Sign In</span>
        <span class="mode-btn" id="registerMode" onclick="setMode('register')">Sign Up</span>
    </div>
    
    <form id="authForm">
        <div class="form-group">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" required>
            <span class="password-toggle" onclick="togglePassword()">👁️</span>
        </div>
        
        <div class="options-row">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="rememberMe"> Remember me
            </label>
        </div>
        
        <div id="error-message-box"></div>
        
        <button type="submit" class="submit-btn" id="actionBtn">Sign In</button>
    </form>
</div>

<script>
let authMode = 'login';

function setMode(mode) {
    authMode = mode;
    document.getElementById('error-message-box').innerText = "";
    
    if (mode === 'login') {
        document.getElementById('loginMode').classList.add('active');
        document.getElementById('registerMode').classList.remove('active');
        document.getElementById('mainTitle').innerText = "System Login";
        document.getElementById('mainSubtitle').innerText = "Verify credentials to proceed";
        document.getElementById('actionBtn').innerText = "Sign In";
    } else {
        document.getElementById('registerMode').classList.add('active');
        document.getElementById('loginMode').classList.remove('active');
        document.getElementById('mainTitle').innerText = "Create Account";
        document.getElementById('mainSubtitle').innerText = "Register your new system credentials";
        document.getElementById('actionBtn').innerText = "Sign Up";
    }
}

function togglePassword() {
    const passwordField = document.getElementById('password');
    const toggleIcon = document.querySelector('.password-toggle');
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleIcon.innerText = '🙈'; 
    } else {
        passwordField.type = 'password';
        toggleIcon.innerText = '👁️';
    }
}

document.getElementById('authForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('error-message-box');
    const actionBtn = document.getElementById('actionBtn');
    
    errorBox.innerText = "";
    errorBox.style.color = "#ef4444";
    const originalBtnText = actionBtn.innerText;
    actionBtn.innerText = "Processing...";

    // تحقق من طول كلمة المرور في الطرف الأمامي أولاً عند التسجيل
    if (authMode === 'register' && password.length < 6) {
        errorBox.innerText = "Password must be at least 6 characters long!";
        actionBtn.innerText = originalBtnText;
        return;
    }

    const endpoint = authMode === 'login' ? '/login' : '/register';

    fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(res => {
        actionBtn.innerText = originalBtnText;
        return res.json();
    })
    .then(data => {
        if (!data) return;
        
        if (data.status === 'success' || data.error === undefined && !data.message) {
            // نجاح العملية الحقيقية والتوجيه للـ Dashboard
            if (authMode === 'register') {
                errorBox.style.color = "#22c55e"; 
                errorBox.innerText = "Account created successfully! Redirecting...";
                setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
            } else {
                window.location.href = '/dashboard';
            }
        } else {
            // إظهار الخطأ الحقيقي القادم من السيرفر (مثل: باسوورد خاطئ أو حساب موجود مسبقاً)
            errorBox.innerText = data.message || "Authentication failed.";
        }
    })
    .catch(err => {
        actionBtn.innerText = originalBtnText;
        errorBox.innerText = "Server connection issue. Please check again.";
    });
});
</script>
</body>
</html>
