<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - RootkitGuard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 35px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 380px; 
            text-align: center; 
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
            transition: all 0.2s ease;
        }
        .tab.active {
            color: #1e293b;
            border-bottom: 3px solid #3b82f6;
        }
        .form-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        input { 
            width: 100%; 
            padding: 13px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 0.95rem; 
            background-color: #f8fafc;
        }
        input:focus { 
            outline: none; 
            border-color: #3b82f6; 
            background-color: #fff;
        }
        .show-pass-container {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
            cursor: pointer;
        }
        .show-pass-container input {
            width: auto;
            margin-right: 6px;
            cursor: pointer;
        }
        button { 
            width: 100%; 
            padding: 13px; 
            background: #1e293b; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 1rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
        }
        button:hover { 
            background: #334155; 
        }
        #message-box { 
            color: #ef4444; 
            font-size: 0.85rem; 
            margin-top: 8px; 
            font-weight: 600; 
            text-align: left; 
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="tabs">
        <div class="tab active" id="loginTab" onclick="switchTab('login')">Sign In</div>
        <div class="tab" id="registerTab" onclick="switchTab('register')">Sign Up</div>
    </div>
    
    <form id="authForm">
        <div class="form-group">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" required>
            
            <label class="show-pass-container">
                <input type="checkbox" id="showPasswordToggle" onclick="togglePasswordVisibility()"> Show Password
            </label>
            
            <div id="message-box"></div>
        </div>
        
        <button type="submit" id="submitBtn">Sign In</button>
    </form>
</div>

<script>
let currentMode = 'login'; // الوضع الافتراضي هو تسجيل الدخول

function switchTab(mode) {
    currentMode = mode;
    document.getElementById('message-box').innerText = "";
    
    if (mode === 'login') {
        document.getElementById('loginTab').classList.add('active');
        document.getElementById('registerTab').classList.remove('active');
        document.getElementById('submitBtn').innerText = "Sign In";
    } else {
        document.getElementById('registerTab').classList.add('active');
        document.getElementById('loginTab').classList.remove('active');
        document.getElementById('submitBtn').innerText = "Sign Up";
    }
}

// ميزة إظهار وإخفاء الباسوورد (Show Password)
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}

document.getElementById('authForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const messageBox = document.getElementById('message-box');
    
    messageBox.innerText = ""; 
    messageBox.style.color = "#ef4444"; // افتراضي أحمر للأخطاء

    // تحديد المسار بناءً على التبويب المختار
    const targetUrl = currentMode === 'login' ? '/login' : '/register';

    fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            if (currentMode === 'register') {
                messageBox.style.color = "#22c55e"; // أخضر للنجاح
                messageBox.innerText = data.message + " Redirecting...";
                setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
            } else {
                window.location.href = '/dashboard';
            }
        } else {
            messageBox.innerText = data.message;
        }
    })
    .catch(err => {
        messageBox.innerText = "Connection error. Please try again.";
    });
});
</script>
</body>
</html>
