<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Login - RootkitGuard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f6f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 380px; 
            text-align: center; 
        }
        h2 { 
            color: #1e293b; 
            font-size: 1.8rem;
            margin-bottom: 5px; 
        }
        p.subtitle { 
            color: #64748b; 
            font-size: 0.95rem; 
            margin-bottom: 30px; 
        }
        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        input { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 1rem; 
            background-color: #f8fafc;
        }
        input:focus { 
            outline: none; 
            border-color: #3b82f6; 
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #1e293b; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 1rem; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            transition: background 0.2s ease;
        }
        button:hover { 
            background: #334155; 
        }
        /* صندوق عرض الرسائل تحت الباسوورد مباشرة */
        #error-message-box { 
            color: #ef4444; 
            font-size: 0.85rem; 
            margin-top: 8px; 
            font-weight: 600; 
            text-align: left; 
            padding: 4px 5px; 
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>System Login</h2>
    <p class="subtitle">Verify credentials to proceed</p>
    
    <form id="loginForm">
        <div class="form-group">
            <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" required>
            
            <div id="error-message-box"></div>
        </div>
        
        <button type="submit">Login</button>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMessageBox = document.getElementById('error-message-box');

    // تصفية النصوص السابقة قبل الإرسال الجديد
    errorMessageBox.innerText = ""; 

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            // الدخول مباشرة للـ Dashboard
            window.location.href = '/dashboard';
        } else {
            // طباعة الرسالة المستلمة فوريّاً قدام المستخدم تحت الصندوق
            errorMessageBox.innerText = data.message;
        }
    })
    .catch(err => {
        errorMessageBox.innerText = "Connection error. Please try again.";
    });
});
</script>
</body>
</html>
